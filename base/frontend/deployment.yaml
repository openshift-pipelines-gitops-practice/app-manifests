apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-handson-frontend
  labels:
    app.kubernetes.io/name: dev-handson-frontend
    app.kubernetes.io/part-of: dev-handson
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dev-handson-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dev-handson-frontend
        app.kubernetes.io/part-of: dev-handson
    spec:
      containers:
        - name: frontend
          image: dev-handson-frontend:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NUXT_PUBLIC_API_BASE
              value: "http://dev-handson-backend:8080"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
